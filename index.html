<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake and Ladder</title>

<!-- ============ CSS ============ -->
<style>
  :root {
    --bg: #1f2a44;
    --panel: #2b3a5e;
    --text: #f3f6ff;
    --accent: #ffcc33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
  }
  h1 { margin: 4px 0 0; font-size: 1.6rem; letter-spacing: 1px; }

  .game {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 920px;
  }

  /* ----- Board ----- */
  .board-wrap {
    position: relative;
    width: min(92vw, 560px);
    aspect-ratio: 1 / 1;
    border: 6px solid #0f1730;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  #board {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
  }
  .cell {
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 2px 3px;
    font-size: clamp(8px, 1.8vw, 12px);
    font-weight: 600;
    color: rgba(0,0,0,.55);
  }
  .cell.light { background: #f6e7b4; }
  .cell.dark  { background: #e3c878; }
  .cell.win   { background: #7ddc8a; }

  #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .token {
    position: absolute;
    width: 4.2%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(7px, 1.5vw, 11px);
    font-weight: 800;
    color: #fff;
    transition: left .18s ease, top .18s ease;
    z-index: 5;
  }
  .token.human { background: #e53935; }
  .token.ai    { background: #1e88e5; }
  .token.slow  { transition: left .7s ease-in-out, top .7s ease-in-out; }

  /* ----- Side panel ----- */
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    width: min(92vw, 300px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .player-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,.07);
    border: 2px solid transparent;
  }
  .player-card.active { border-color: var(--accent); background: rgba(255,204,51,.12); }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; }
  .dot.human { background: #e53935; }
  .dot.ai    { background: #1e88e5; }
  .player-card .pos { margin-left: auto; font-weight: 700; }

  .dice-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #dice {
    width: 74px; height: 74px;
    background: #fff;
    color: #222;
    border-radius: 14px;
    font-size: 2.6rem;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  #dice.rolling { animation: shake .12s infinite; }
  @keyframes shake {
    0%   { transform: rotate(-8deg) scale(1.05); }
    50%  { transform: rotate(8deg)  scale(0.95); }
    100% { transform: rotate(-8deg) scale(1.05); }
  }

  button {
    font: inherit;
    font-weight: 700;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--accent);
    color: #222;
    width: 100%;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: rgba(255,255,255,.15); color: var(--text); }

  #log {
    height: 150px;
    overflow-y: auto;
    background: rgba(0,0,0,.25);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: .85rem;
    line-height: 1.5;
  }
  #log div { margin-bottom: 2px; }

  #message {
    text-align: center;
    font-weight: 700;
    min-height: 1.4em;
    color: var(--accent);
  }
  /* ===== Redesigned side panel ===== */
  .panel {
    background: linear-gradient(160deg, #36497f 0%, #222d52 100%);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px;
    padding: 18px;
    width: min(92vw, 320px);
    gap: 12px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
  }
  .panel-title {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    opacity: .6;
  }

  .player-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,.06);
    border: 2px solid transparent;
    transition: all .25s ease;
  }
  .player-card.active {
    border-color: var(--accent);
    background: rgba(255,204,51,.14);
    box-shadow: 0 0 18px rgba(255,204,51,.28);
    transform: scale(1.03);
  }
  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    border: 3px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.45);
  }
  .avatar.human { background: #e53935; }
  .avatar.ai    { background: #1e88e5; }
  .info { flex: 1; }
  .pname { font-weight: 700; font-size: 1.05rem; }
  .psub  { font-size: .75rem; opacity: .65; }
  .square {
    text-align: center;
    background: rgba(0,0,0,.3);
    border-radius: 12px;
    padding: 4px 10px;
    min-width: 58px;
  }
  .square small {
    display: block;
    font-size: .58rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: .65;
  }
  .square span { font-size: 1.4rem; font-weight: 800; color: var(--accent); }

  .dice-area { gap: 8px; padding: 6px 0 2px; }
  #dice {
    width: 88px; height: 88px;
    background: linear-gradient(145deg, #ffffff, #dde3f1);
    border-radius: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    align-items: center;
    justify-items: center;
    padding: 13px;
    box-shadow: 0 6px 0 #a7b0c7, 0 12px 20px rgba(0,0,0,.45);
  }
  #dice.idle { display: flex; align-items: center; justify-content: center; font-size: 2.6rem; padding: 0; }
  #dice span { display: block; width: 78%; height: 78%; }
  #dice span.pip {
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a5a5a, #111);
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.5);
  }
  #dice.rolling { animation: shake .12s infinite; }

  button.roll {
    font-size: 1.1rem;
    padding: 13px 18px;
    border-radius: 14px;
    background: linear-gradient(#ffd84d, #ffb300);
    box-shadow: 0 5px 0 #b57f00, 0 8px 14px rgba(0,0,0,.35);
    transition: transform .08s, box-shadow .08s;
  }
  button.roll:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #b57f00; }
  button.roll:disabled { box-shadow: 0 5px 0 #7a5a10; }
  .hint { font-size: .7rem; opacity: .5; }

  #message {
    background: rgba(255,204,51,.12);
    border-radius: 999px;
    padding: 6px 12px;
    min-height: 2em;
    display: flex; align-items: center; justify-content: center;
    font-size: .95rem;
  }

  #log {
    height: 130px;
    background: rgba(0,0,0,.28);
    border-radius: 12px;
    padding: 8px;
    font-size: .8rem;
    scrollbar-width: thin;
  }
  #log div {
    padding: 4px 8px;
    margin-bottom: 4px;
    border-left: 3px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.05);
    border-radius: 0 6px 6px 0;
  }
  #log div.good { border-left-color: #4ade80; }
  #log div.bad  { border-left-color: #f87171; }
  #log div.star { border-left-color: #fbbf24; }

  button.secondary {
    background: transparent;
    border: 2px solid rgba(255,255,255,.28);
    color: var(--text);
    border-radius: 12px;
    transition: background .2s;
  }
  button.secondary:hover { background: rgba(255,255,255,.12); }
</style>
</head>

<body>
  <h1>🐍 Snake &amp; Ladder 🪜</h1>

  <div class="game">
    <div class="board-wrap" id="boardWrap">
      <div id="board"></div>
      <svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>

    <div class="panel">
      <div class="panel-title">Players</div>

      <div class="player-card" id="card-human">
        <div class="avatar human">😀</div>
        <div class="info">
          <div class="pname">You</div>
          <div class="psub">Red token</div>
        </div>
        <div class="square"><small>Square</small><span id="pos-human">0</span></div>
      </div>

      <div class="player-card" id="card-ai">
        <div class="avatar ai">🤖</div>
        <div class="info">
          <div class="pname">Computer</div>
          <div class="psub">Blue token</div>
        </div>
        <div class="square"><small>Square</small><span id="pos-ai">0</span></div>
      </div>

      <div class="dice-area">
        <div id="dice" class="idle">🎲</div>
        <button id="rollBtn" class="roll">Roll Dice</button>
        <div class="hint">or press Space</div>
      </div>

      <div id="message"></div>

      <div class="panel-title">Game log</div>
      <div id="log"></div>

      <button class="secondary" id="restartBtn">↻ Restart Game</button>
    </div>
  </div>

<!-- ============ JavaScript ============ -->
<script>
  const BOARD_SIZE = 100;

  // snake head -> tail, ladder bottom -> top
  const SNAKES  = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
  const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };

  const boardEl   = document.getElementById("board");
  const overlayEl = document.getElementById("overlay");
  const wrapEl    = document.getElementById("boardWrap");
  const diceEl    = document.getElementById("dice");
  const rollBtn   = document.getElementById("rollBtn");
  const restartBtn= document.getElementById("restartBtn");
  const logEl     = document.getElementById("log");
  const msgEl     = document.getElementById("message");

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  // draw a dice face with real dots (0 = idle icon)
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function setDice(v) {
    if (!v) {
      diceEl.className = "idle";
      diceEl.textContent = "🎲";
      return;
    }
    diceEl.classList.remove("idle");
    let html = "";
    for (let i = 0; i < 9; i++) html += `<span class="${PIPS[v].includes(i) ? "pip" : ""}"></span>`;
    diceEl.innerHTML = html;
  }

  let players, turn, busy, gameOver;

  /* ---- coordinates: square number -> centre point (percent, 0-100) ---- */
  function cellCenter(n) {
    if (n <= 0) return { x: -3, y: 103 };           // off-board start area
    const r = Math.floor((n - 1) / 10);             // row from bottom
    const c = (r % 2 === 0) ? (n - 1) % 10 : 9 - ((n - 1) % 10);
    return { x: c * 10 + 5, y: (9 - r) * 10 + 5 };
  }

  /* ---- build board ---- */
  function buildBoard() {
    boardEl.innerHTML = "";
    for (let row = 9; row >= 0; row--) {
      for (let col = 0; col < 10; col++) {
        const n = row % 2 === 0 ? row * 10 + col + 1 : row * 10 + (10 - col);
        const cell = document.createElement("div");
        cell.className = "cell " + ((row + col) % 2 === 0 ? "dark" : "light") + (n === 100 ? " win" : "");
        cell.textContent = n === 100 ? "100 🏁" : n;
        boardEl.appendChild(cell);
      }
    }
  }

  /* ---- draw ladders and snakes with SVG ---- */
  function drawOverlay() {
    let svg = "";

    // ladders
    for (const [from, to] of Object.entries(LADDERS)) {
      const a = cellCenter(+from), b = cellCenter(+to);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const px = -uy * 1.3, py = ux * 1.3;           // perpendicular offset
      svg += `<line x1="${a.x + px}" y1="${a.y + py}" x2="${b.x + px}" y2="${b.y + py}" stroke="#7b4a1e" stroke-width="0.9" stroke-linecap="round"/>`;
      svg += `<line x1="${a.x - px}" y1="${a.y - py}" x2="${b.x - px}" y2="${b.y - py}" stroke="#7b4a1e" stroke-width="0.9" stroke-linecap="round"/>`;
      const rungs = Math.floor(len / 4.5);
      for (let i = 1; i < rungs; i++) {
        const t = i / rungs;
        const cx = a.x + dx * t, cy = a.y + dy * t;
        svg += `<line x1="${cx + px}" y1="${cy + py}" x2="${cx - px}" y2="${cy - py}" stroke="#a9692b" stroke-width="0.7" stroke-linecap="round"/>`;
      }
    }

    // snakes: wavy tapered body, striped pattern, proper head with eyes and tongue
    const palettes = [
      ["#3aa655", "#1b5e30"],
      ["#e0574f", "#7f1d1d"],
      ["#9b59b6", "#4a235a"],
      ["#eab02a", "#7a5200"],
      ["#1abc9c", "#0b4f43"],
    ];
    let k = 0;
    for (const [head, tail] of Object.entries(SNAKES)) {
      const h = cellCenter(+head), t = cellCenter(+tail);
      const [body, dark] = palettes[k++ % palettes.length];

      const dx = t.x - h.x, dy = t.y - h.y;
      const len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const nx = -uy, ny = ux;
      const waves = Math.max(2, Math.round(len / 13));
      const amp = 2.8;
      const N = 50;

      // centre line of the body
      const pts = [];
      for (let i = 0; i <= N; i++) {
        const s = i / N;
        const off = amp * Math.sin(s * waves * Math.PI) * Math.min(1, s * 5);
        pts.push({ x: h.x + dx * s + nx * off, y: h.y + dy * s + ny * off });
      }

      // build tapered outline (thick near head, thin pointed tail)
      const left = [], right = [];
      for (let i = 0; i <= N; i++) {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
        const tx = b.x - a.x, ty = b.y - a.y;
        const tl = Math.hypot(tx, ty) || 1;
        const px = -ty / tl, py = tx / tl;
        const s = i / N;
        const w = 0.1 + 1.2 * Math.pow(1 - s, 0.75);
        left.push(`${(pts[i].x + px * w).toFixed(2)} ${(pts[i].y + py * w).toFixed(2)}`);
        right.push(`${(pts[i].x - px * w).toFixed(2)} ${(pts[i].y - py * w).toFixed(2)}`);
      }
      const outline = "M " + left.join(" L ") + " L " + right.reverse().join(" L ") + " Z";
      svg += `<path d="${outline}" fill="${body}" stroke="${dark}" stroke-width="0.35" stroke-linejoin="round"/>`;

      // light belly line down the middle
      const mid = pts.map((p) => `${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(" L ");
      svg += `<path d="M ${mid}" fill="none" stroke="#fff" stroke-width="0.5" stroke-linecap="round" opacity="0.28"/>`;

      // cross stripes along the body
      for (let i = 4; i < N - 3; i += 3) {
        const a = pts[i - 1], b = pts[i + 1];
        const tx = b.x - a.x, ty = b.y - a.y;
        const tl = Math.hypot(tx, ty) || 1;
        const px = -ty / tl, py = tx / tl;
        const w = (0.1 + 1.2 * Math.pow(1 - i / N, 0.75)) * 0.85;
        svg += `<line x1="${(pts[i].x + px * w).toFixed(2)}" y1="${(pts[i].y + py * w).toFixed(2)}" x2="${(pts[i].x - px * w).toFixed(2)}" y2="${(pts[i].y - py * w).toFixed(2)}" stroke="${dark}" stroke-width="0.55" stroke-linecap="round" opacity="0.55"/>`;
      }

      // head: oriented away from the body
      const ang = Math.atan2(pts[0].y - pts[2].y, pts[0].x - pts[2].x) * 180 / Math.PI;
      svg += `<g transform="translate(${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}) rotate(${ang.toFixed(1)})">` +
               `<path d="M 1.9 0 L 3.5 0" stroke="#e11d48" stroke-width="0.3" stroke-linecap="round"/>` +
               `<path d="M 3.5 0 L 4.3 -0.55 M 3.5 0 L 4.3 0.55" stroke="#e11d48" stroke-width="0.25" stroke-linecap="round"/>` +
               `<ellipse cx="0.5" cy="0" rx="2.3" ry="1.7" fill="${body}" stroke="${dark}" stroke-width="0.35"/>` +
               `<circle cx="1.1" cy="-0.85" r="0.55" fill="#fff" stroke="${dark}" stroke-width="0.12"/>` +
               `<circle cx="1.1" cy="0.85" r="0.55" fill="#fff" stroke="${dark}" stroke-width="0.12"/>` +
               `<circle cx="1.25" cy="-0.85" r="0.27" fill="#111"/>` +
               `<circle cx="1.25" cy="0.85" r="0.27" fill="#111"/>` +
             `</g>`;
    }
    overlayEl.innerHTML = svg;
  }

  /* ---- tokens ---- */
  function createTokens() {
    wrapEl.querySelectorAll(".token").forEach((t) => t.remove());
    players.forEach((p) => {
      const t = document.createElement("div");
      t.className = "token " + (p.isAI ? "ai" : "human");
      t.textContent = p.isAI ? "AI" : "You";
      wrapEl.appendChild(t);
      p.el = t;
      placeToken(p);
    });
  }

  function placeToken(p) {
    const c = cellCenter(p.pos);
    // small offset so both tokens are visible on the same square
    const off = p.isAI ? 2.2 : -2.2;
    const size = 4.2;
    p.el.style.left = (c.x + (p.pos > 0 ? off : off * 0.6) - size / 2) + "%";
    p.el.style.top  = (c.y - size / 2) + "%";
    document.getElementById("pos-" + (p.isAI ? "ai" : "human")).textContent = p.pos;
  }

  /* ---- helpers ---- */
  function log(text) {
    const d = document.createElement("div");
    if (text.includes("Ladder")) d.className = "good";
    else if (text.includes("Snake")) d.className = "bad";
    else if (text.includes("rolled a 6")) d.className = "star";
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setActive() {
    document.getElementById("card-human").classList.toggle("active", turn === 0 && !gameOver);
    document.getElementById("card-ai").classList.toggle("active", turn === 1 && !gameOver);
  }

  async function animateRoll() {
    diceEl.classList.add("rolling");
    for (let i = 0; i < 8; i++) {
      setDice(1 + Math.floor(Math.random() * 6));
      await sleep(70);
    }
    diceEl.classList.remove("rolling");
    const value = 1 + Math.floor(Math.random() * 6);
    setDice(value);
    return value;
  }

  /* ---- one full turn ---- */
  async function playTurn() {
    if (busy || gameOver) return;
    busy = true;
    rollBtn.disabled = true;

    const p = players[turn];
    const who = p.isAI ? "Computer" : "You";
    msgEl.textContent = "";

    const dice = await animateRoll();
    log(`${who} rolled a ${dice}`);

    if (p.pos + dice > BOARD_SIZE) {
      log(`${who} need an exact roll to reach 100.`);
    } else {
      // step square by square
      for (let i = 0; i < dice; i++) {
        p.pos++;
        placeToken(p);
        await sleep(200);
      }

      if (SNAKES[p.pos]) {
        log(`🐍 Snake! ${who} slide down to ${SNAKES[p.pos]}`);
        msgEl.textContent = "🐍 Snake bite!";
        await sleep(300);
        p.el.classList.add("slow");
        p.pos = SNAKES[p.pos];
        placeToken(p);
        await sleep(750);
        p.el.classList.remove("slow");
      } else if (LADDERS[p.pos]) {
        log(`🪜 Ladder! ${who} climb up to ${LADDERS[p.pos]}`);
        msgEl.textContent = "🪜 Ladder up!";
        await sleep(300);
        p.el.classList.add("slow");
        p.pos = LADDERS[p.pos];
        placeToken(p);
        await sleep(750);
        p.el.classList.remove("slow");
      }

      if (p.pos === BOARD_SIZE) {
        gameOver = true;
        msgEl.textContent = p.isAI ? "🤖 Computer wins! Try again." : "🏆 You win! Congratulations!";
        log(p.isAI ? "Computer reached 100 and wins." : "You reached 100 and win!");
        setActive();
        busy = false;
        rollBtn.disabled = true;
        return;
      }
    }

    // a 6 gives an extra turn
    if (dice === 6) {
      log(`🎉 ${who} rolled a 6 and get another turn!`);
    } else {
      turn = 1 - turn;
    }

    busy = false;
    setActive();
    nextAction();
  }

  /* ---- decide who acts next ---- */
  function nextAction() {
    if (gameOver) return;
    if (players[turn].isAI) {
      rollBtn.disabled = true;
      setTimeout(playTurn, 900);
    } else {
      rollBtn.disabled = false;
    }
  }

  /* ---- start / restart ---- */
  function startGame() {
    players = [
      { name: "You",      pos: 0, isAI: false, el: null },
      { name: "Computer", pos: 0, isAI: true,  el: null },
    ];
    turn = 0;
    busy = false;
    gameOver = false;
    logEl.innerHTML = "";
    msgEl.textContent = "Your turn - roll the dice!";
    setDice(0);
    buildBoard();
    drawOverlay();
    createTokens();
    setActive();
    rollBtn.disabled = false;
    log("Game started. You are red, Computer is blue.");
  }

  rollBtn.addEventListener("click", playTurn);
  restartBtn.addEventListener("click", startGame);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !rollBtn.disabled) { e.preventDefault(); playTurn(); }
  });

  startGame();
</script>
</body>
</html>
